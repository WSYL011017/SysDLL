[package]
name = "sysdll-cli-ipc"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "SysDll elevated CLI subprocess (requireAdministrator) for repairs"

[[bin]]
name = "sysdll-cli"
path = "src/main.rs"

[build-dependencies]
embed-resource = "3"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
sysdll-core = { path = "../sysdll-core" }
sha2 = { workspace = true }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
] }
