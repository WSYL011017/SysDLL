[workspace]
resolver = "2"
members = [
    ".",
    "crates/sysdll-core",
    "crates/sysdll-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["suyala"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
rayon = "1"
pelite = "0.10"
walkdir = "2"
clap = { version = "4", features = ["derive"] }
parking_lot = "0.12"
crossbeam-channel = "0.5"
sha2 = "0.10"

[package]
name = "sysdll"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "SysDll GUI host (Tauri app)"

[lib]
name = "sysdll_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
sysdll-core = { path = "crates/sysdll-core" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_Shell", "Win32_Foundation"] }
